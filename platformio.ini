; CYD//RECON - radio recon firmware for the Freenove ESP32-S3 Display 3.5" (FNK0104N)
; Panel: ST77922 320x480 over QSPI, Sitronix-style I2C touch, ES8311 audio codec.

[platformio]
default_envs = fnk0104n

[env:fnk0104n]
; pioarduino = Arduino-ESP32 3.x (ESP-IDF 5.x); needed for ESP_I2S and the S3 QSPI driver
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L

; Uncomment if PlatformIO auto-picks the wrong serial port (e.g. a Bluetooth
; device). Run `pio device list` to find yours. Wildcards are allowed.
;upload_port = /dev/cu.usbmodem*
;monitor_port = /dev/cu.usbmodem*
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_unflags = -std=gnu++11 -std=gnu++17
build_flags =
  -std=gnu++2a
  -O2
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  ; NimBLE: observer only, keep it lean
  -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
  -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0

lib_deps =
  https://github.com/lovyan03/LovyanGFX.git#1.2.19
  https://github.com/h2zero/NimBLE-Arduino.git#2.3.9
